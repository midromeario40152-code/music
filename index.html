<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet Echoes - Premium Audio Platform</title>
    <style>
        :root {
            --accent-color: #ff4757;
            --premium-color: #f1c40f;
            --bg-body: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #707070;
            --border: #f0f0f0;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --transition: all 0.25s ease;
            --player-height: 100px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            user-select: none; /* Ngăn chặn copy thông thường để bảo vệ bản quyền */
            padding-bottom: var(--player-height);
        }

        /* Watermark Layer */
        .watermark-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 8rem;
            color: rgba(0,0,0,0.03);
            pointer-events: none;
            z-index: -1;
            font-weight: 900;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        .logo-container { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon { width: 35px; height: 35px; background: linear-gradient(135deg, #ff4757, #ff6b81); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; }
        .logo-text { font-size: 22px; font-weight: 800; color: var(--text-main); }

        /* Tìm kiếm thông minh */
        .search-wrapper { flex: 0 1 450px; position: relative; }
        .search-wrapper input {
            width: 100%; padding: 12px 20px 12px 45px; border-radius: 25px; border: 1px solid var(--border);
            background: #f8f9fa; outline: none; transition: var(--transition); font-size: 14px;
        }
        .search-wrapper input:focus { background: white; border-color: var(--accent-color); box-shadow: 0 0 0 4px rgba(255, 71, 87, 0.1); }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }

        /* User Info & Diamonds */
        .user-stats { display: flex; align-items: center; gap: 20px; }
        .diamond-count { display: flex; align-items: center; gap: 8px; background: #fff4f5; padding: 8px 15px; border-radius: 20px; color: var(--accent-color); font-weight: 700; border: 1px solid #ffeaea; }
        .premium-badge { background: var(--premium-color); color: #000; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 800; cursor: pointer; display: none; }
        .premium-badge.active { display: block; }
        .btn-upgrade { background: var(--text-main); color: white; border: none; padding: 8px 18px; border-radius: 20px; font-weight: 600; cursor: pointer; }

        /* Music Grid */
        .container { max-width: 1400px; margin: 40px auto; padding: 0 30px; }
        .music-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 30px; }

        .music-card { position: relative; border-radius: 15px; overflow: hidden; transition: var(--transition); cursor: pointer; }
        .music-card:hover { transform: translateY(-8px); }
        .thumb-box { position: relative; aspect-ratio: 1; border-radius: 15px; overflow: hidden; box-shadow: var(--shadow); }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
        .card-details { padding: 12px 5px; }
        .song-title { font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 13px; color: var(--text-sub); margin: 3px 0; }

        /* Context Menu */
        #contextMenu {
            position: fixed; display: none; background: white; min-width: 180px; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); z-index: 3000; padding: 8px 0; border: 1px solid var(--border);
        }
        .menu-item {
            padding: 10px 20px; display: flex; align-items: center; gap: 12px; font-size: 14px;
            cursor: pointer; transition: 0.2s; color: var(--text-main);
        }
        .menu-item:hover { background: #f8f9fa; color: var(--accent-color); }
        .menu-item svg { width: 16px; height: 16px; }
        .menu-sep { height: 1px; background: var(--border); margin: 5px 0; }

        /* Modal Payment/Premium */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 4000;
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white; width: 90%; max-width: 450px; padding: 35px; border-radius: 24px;
            position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal-content h2 { margin-top: 0; font-weight: 800; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; color: var(--text-sub); }
        .input-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 15px; background: var(--accent-color); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }

        /* Bottom Player */
        .player-bar {
            position: fixed; bottom: 0; left: 0; right: 0; height: var(--player-height);
            background: rgba(255,255,255,0.98); border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 40px;
            z-index: 2500; transition: transform 0.3s;
        }
        .player-bar.hidden { transform: translateY(100%); }

        .track-info { display: flex; align-items: center; gap: 15px; width: 300px; }
        .track-img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        .main-controls { flex: 1; display: flex; flex-direction: column; align-items: center; max-width: 600px; }
        .prog-container { width: 100%; display: flex; align-items: center; gap: 15px; margin-top: 10px; }
        .seek-slider { flex: 1; height: 5px; background: #eee; border-radius: 5px; position: relative; cursor: pointer; }
        .seek-fill { height: 100%; background: var(--accent-color); width: 0%; border-radius: 5px; }

        /* Notification */
        #toast {
            position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 12px 25px; border-radius: 30px;
            font-size: 14px; z-index: 5000; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="watermark-overlay">Velvet Echoes</div>

    <header>
        <a href="#" class="logo-container">
            <div class="logo-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>
            <span class="logo-text">Velvet Echoes</span>
        </a>

        <div class="search-wrapper">
            <span class="search-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
            <input type="text" id="searchInput" placeholder="Tìm kiếm những bài nhạc bạn yêu thích ...">
        </div>

        <div class="user-stats">
            <div class="diamond-count">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.1 3.1l8.5 7.4-8.5 10.4-8.5-10.4 8.5-7.4z"/></svg>
                <span id="diamondVal">100</span>
            </div>
            <div id="premiumBadge" class="premium-badge">PREMIUM</div>
            <button class="btn-upgrade" id="btnUpgrade">Nâng cấp</button>
        </div>
    </header>

    <div class="container">
        <h2 id="sectionTitle">Thư viện âm nhạc</h2>
        <div class="music-grid" id="musicGrid"></div>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu">
        <div class="menu-item" id="menuLike">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            Thích (Kiếm tiền)
        </div>
        <div class="menu-item" id="menuSave">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Lưu vào Playlist
        </div>
        <div class="menu-sep"></div>
        <div class="menu-item" id="menuDownload">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Tải về (20 💎)
        </div>
        <div class="menu-item" id="menuComment">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-11.7 8.38 8.38 0 0 1 3.8.9L21 3z"></path></svg>
            Bình luận
        </div>
    </div>

    <!-- Payment Modal -->
    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <button style="position: absolute; right: 20px; top: 20px; border: none; background: none; font-size: 20px; cursor: pointer;" id="closeModal">✕</button>
            <h2>Nâng cấp Premium</h2>
            <p style="color: var(--text-sub); font-size: 14px; margin-bottom: 25px;">Nghe nhạc Offline, chất lượng cao và không quảng cáo.</p>
            
            <div class="input-group">
                <label>MÃ QUÀ TẶNG (ID)</label>
                <input type="text" id="giftCode" placeholder="Nhập mã ID của bạn...">
            </div>
            <div style="text-align: center; margin: 15px 0; font-size: 12px; color: #ccc;">HOẶC THANH TOÁN THẺ</div>
            <div class="input-group">
                <label>SỐ THẺ NGÂN HÀNG</label>
                <input type="text" placeholder="xxxx xxxx xxxx xxxx">
            </div>
            <div style="display: flex; gap: 15px;">
                <div class="input-group" style="flex: 1;">
                    <label>HẠN SỬ DỤNG</label>
                    <input type="text" placeholder="MM/YY">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>CVV</label>
                    <input type="password" placeholder="***">
                </div>
            </div>
            <button class="btn-submit" id="submitPayment">XÁC NHẬN THANH TOÁN - 199.000đ</button>
        </div>
    </div>

    <!-- Player Bar -->
    <div class="player-bar hidden" id="playerBar">
        <div class="track-info">
            <img src="" class="track-img" id="pImg">
            <div>
                <div class="song-title" id="pTitle" style="font-size: 14px;"></div>
                <div class="song-artist" id="pArtist"></div>
            </div>
        </div>
        <div class="main-controls">
            <div style="display: flex; gap: 25px; align-items: center;">
                <button style="background: none; border: none; cursor: pointer;"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button id="mainPlayBtn" style="width: 45px; height: 45px; border-radius: 50%; border: none; background: var(--text-main); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                    <svg id="playSvg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button style="background: none; border: none; cursor: pointer;"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
            </div>
            <div class="prog-container">
                <span style="font-size: 11px; color: var(--text-sub);" id="curTime">0:00</span>
                <div class="seek-slider" id="seekSlider"><div class="seek-fill" id="seekFill"></div></div>
                <span style="font-size: 11px; color: var(--text-sub);" id="durTime">0:00</span>
            </div>
        </div>
        <div style="width: 300px; display: flex; justify-content: flex-end;">
             <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        </div>
    </div>

    <div id="toast"></div>
    <audio id="audio"></audio>

    <script>
        const songs = [
            { id: 1, name: "Downtown Glow", artist: "Ghostrifter Official", thumb: "https://thuthuatnhanh.com/wp-content/uploads/2021/06/Hinh-anh-hinh-nen-am-nhac-anime.jpg", src: "Ghostrifter-Official-Devyzed-Downtown-Glow(chosic.com).mp3" },
            { id: 2, name: "Echoes in Blue", artist: "Tokyo Music Walker", thumb: "https://www.fwd.com.vn/images/v3/assets/bltca0b25cb8321936d/blt5eb768e92d1f86e2/666a6c0e0531912f2e1f49f6/Loi_ich_suc_khoe_bat_ngo_tu_am_nhac_1200x600.webp", src: "echoes-in-blue-by-tokyo-music-walker-chosic.com_.mp3" },
            { id: 3, name: "Purple Dream", artist: "Ghostrifter Official", thumb: "https://cdn2.fptshop.com.vn/unsafe/1920x0/filters:format(webp):quality(75)/hinh_nen_am_nhac_cover_735bc482b1.png", src: "Ghostrifter-Official-Purple-Dream(chosic.com).mp3" },
            { id: 4, name: "Beloved", artist: "Roa", thumb: "https://cdn2.fptshop.com.vn/unsafe/800x0/hinh_nen_am_nhac_11_e4a8a8a255.png", src: "Roa-Beloved(chosic.com).mp3" },
            { id: 5, name: "Colorful Flowers", artist: "Lofi Vibes", thumb: "https://cdn2.fptshop.com.vn/unsafe/800x0/hinh_nen_am_nhac_22_50a0362454.png", src: "Colorful-Flowers(chosic.com).mp3" },
            { id: 6, name: "Daydreams", artist: "Relax Music", thumb: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400", src: "Daydreams-chosic.com_.mp3" },
            { id: 7, name: "Patterns On The Asphalt", artist: "Lofi Chill", thumb: "https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=400", src: "Patterns_On_The_Asphalt.mp3" },
            { id: 8, name: "Coffee in a Sunlit Room", artist: "Acoustic Vibes", thumb: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400", src: "Coffee_in_a_Sunlit_Room.mp3" },
            { id: 9, name: "Morning on the Perfume River", artist: "Nature Sound", thumb: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400", src: "Morning_on_the_Perfume_River.mp3" },
            { id: 10, name: "Notes Under Rain", artist: "Rainy Jazz", thumb: "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=400", src: "Notes_Under_Rain.mp3" }
        ];

        let userDiamonds = 100;
        let isPremium = false;
        let selectedSong = null;
        const MY_ID = "FFFFJHEWF477*&%5465";

        const audio = document.getElementById('audio');
        const grid = document.getElementById('musicGrid');
        const ctxMenu = document.getElementById('contextMenu');
        const toast = document.getElementById('toast');

        // Render & Tìm kiếm thông minh
        function renderSongs(filter = "") {
            grid.innerHTML = "";
            const filtered = songs.filter(s => 
                s.name.toLowerCase().includes(filter.toLowerCase()) || 
                s.artist.toLowerCase().includes(filter.toLowerCase())
            );
            
            filtered.forEach(song => {
                const card = document.createElement('div');
                card.className = 'music-card';
                card.oncontextmenu = (e) => showContextMenu(e, song);
                card.onclick = () => handlePlay(song);
                card.innerHTML = `
                    <div class="thumb-box">
                        <img src="${song.thumb}">
                    </div>
                    <div class="card-info">
                        <p class="song-title">${song.name}</p>
                        <p class="song-artist">${song.artist}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('searchInput').oninput = (e) => renderSongs(e.target.value);

        // Hệ thống thanh toán & Premium
        document.getElementById('btnUpgrade').onclick = () => document.getElementById('paymentModal').style.display = 'flex';
        document.getElementById('closeModal').onclick = () => document.getElementById('paymentModal').style.display = 'none';

        document.getElementById('submitPayment').onclick = () => {
            const code = document.getElementById('giftCode').value;
            if (code === MY_ID) {
                activatePremium("Mã quà tặng hợp lệ! Chào mừng chủ nhân.");
            } else {
                showToast("Đang xác thực thẻ... Thanh toán thành công!");
                activatePremium("Chúc mừng! Bạn đã là thành viên Premium.");
            }
            document.getElementById('paymentModal').style.display = 'none';
        };

        function activatePremium(msg) {
            isPremium = true;
            document.getElementById('premiumBadge').classList.add('active');
            document.getElementById('btnUpgrade').style.display = 'none';
            showToast(msg);
        }

        // Context Menu Logic
        function showContextMenu(e, song) {
            e.preventDefault();
            selectedSong = song;
            ctxMenu.style.display = 'block';
            ctxMenu.style.left = e.pageX + 'px';
            ctxMenu.style.top = e.pageY + 'px';
        }

        window.onclick = () => ctxMenu.style.display = 'none';

        document.getElementById('menuLike').onclick = () => {
            showToast(`Bạn đã thích "${selectedSong.name}". +10đ vào quỹ Musicer của bạn!`);
        };

        document.getElementById('menuDownload').onclick = () => {
            if (userDiamonds < 20) return showToast("Không đủ kim cương!");
            userDiamonds -= 20;
            updateUI();
            showToast(`[MUSICER Watermark] Đang tải bài hát bản quyền...`);
        };

        // Play Logic
        function handlePlay(song) {
            if (!isPremium && userDiamonds < 10) {
                return showToast("Bạn cần ít nhất 10 kim cương để nghe nhạc bản quyền!");
            }
            
            if (!isPremium) {
                userDiamonds -= 10;
                updateUI();
                showToast(`[Velvet Echoes] Đã trừ 10 kim cương phí bản quyền.`);
            }

            audio.src = song.src;
            audio.play();
            
            document.getElementById('pTitle').innerText = song.name;
            document.getElementById('pArtist').innerText = song.artist;
            document.getElementById('pImg').src = song.thumb;
            document.getElementById('playerBar').classList.remove('hidden');
            updatePlayIcon(true);
        }

        function updateUI() {
            document.getElementById('diamondVal').innerText = userDiamonds;
        }

        function showToast(msg) {
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        // Controls
        function updatePlayIcon(playing) {
            document.getElementById('playSvg').innerHTML = playing 
                ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' 
                : '<path d="M8 5v14l11-7z"/>';
        }

        document.getElementById('mainPlayBtn').onclick = () => {
            if (audio.paused) { audio.play(); updatePlayIcon(true); }
            else { audio.pause(); updatePlayIcon(false); }
        };

        audio.ontimeupdate = () => {
            const p = (audio.currentTime / audio.duration) * 100;
            document.getElementById('seekFill').style.width = p + '%';
            document.getElementById('curTime').innerText = formatTime(audio.currentTime);
            document.getElementById('durTime').innerText = formatTime(audio.duration || 0);
        };

        function formatTime(s) {
            const m = Math.floor(s/60);
            const sec = Math.floor(s%60);
            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
        }

        renderSongs();
    </script>
</body>
</html>
